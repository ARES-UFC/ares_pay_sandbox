<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ares_pay_sandbox: Checkout de Testes</title>
  <script src="https://js.stripe.com/v3/"></script>
  <style>
    :root { font-family: system-ui, sans-serif; }
    body { max-width: 420px; margin: 3rem auto; padding: 0 1rem; color: #222; }
    .card { border: 1px solid #ddd; border-radius: 8px; padding: 1.25rem; margin-bottom: 1rem; }
    button { width: 100%; padding: .75rem; border: 0; border-radius: 6px; background: #635bff; color: #fff; font-size: 1rem; cursor: pointer; }
    button:disabled { opacity: .5; cursor: not-allowed; }
    select { width: 100%; padding: .5rem; margin: .5rem 0 1rem; }
    #payment-element { margin: 1rem 0; }
    .status { min-height: 1.5em; font-weight: 600; }
    .ok { color: #0a7d33; } .err { color: #b3001b; }
    small { color: #777; }
    code { background: #f4f4f4; padding: .1rem .3rem; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>ares_pay_sandbox</h1>

  <div class="card">
    <label for="sku">Produto (ambiente de testes)</label>
    <select id="sku">
      <option value="sku-areia">Pacote Areia (R$ 19,90)</option>
      <option value="sku-cascalho">Pacote Cascalho (R$ 49,90)</option>
    </select>
    <button id="pay-btn">Iniciar pagamento</button>
    <p class="status" id="status"></p>
  </div>

  <div class="card">
    <!--
      CONTROLE 1: TOKENIZAÇÃO
      O formulário abaixo é renderizado pelo Stripe.js dentro de um iframe seguro
      hospedado no domínio do Stripe. Os dados do cartão (número, validade e CVC)
      são transmitidos diretamente ao gateway pelo próprio iframe. Este código HTML
      nunca acessa os dados sensíveis do cartão, e o servidor recebe apenas os
      identificadores opacos gerados após a tokenização.
    -->
    <form id="payment-form">
      <div id="payment-element"></div>
      <button id="confirm-btn" hidden>Pagar agora</button>
    </form>
    <small>
      Ambiente de testes. Utilize os cartões de teste da documentação oficial do Stripe,
      como <code>4242 4242 4242 4242</code>, com qualquer data de validade futura e qualquer CVC.
      Cartões reais não são aceitos neste ambiente.
    </small>
  </div>

  <script src="/app.js"></script>
</body>
</html>
